
name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistem paketlerini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Android SDK lisanslarını kabul et
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"
          buildozer android debug 2>&1 | tee build.log
        continue-on-error: true

      - name: AIDL aracını kontrol et ve derle
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          echo "SDK kontrol ediliyor..."
          find "$SDK" -type f -name aidl -print
          if ! find "$SDK" -type f -name aidl | grep -q .; then
            echo "AIDL bulunamadı. Buildozer SDK kurulumunu kontrol et."
            exit 1
          fi
          buildozer android debug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: FPS-Panel-APK
          path: bin/*.apk
          
