
name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python ve Java kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Buildozer kur
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake \
            autopoint gettext
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: APK derle
        run: buildozer android debug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: FPS-Panel-APK
          path: bin/*.apk
          
